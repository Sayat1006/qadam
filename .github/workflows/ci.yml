name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типтер
        run: npx tsc --noEmit -p .
      - name: Мазмұн генераторларын тексеру
        run: npm run check
      - name: Unit-тесттер
        run: npm test
      - name: Жинау
        run: npx vite build
      - name: Playwright браузері
        run: npx playwright install --with-deps chromium
      - name: E2E және қолжетімділік (axe-core)
        run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
